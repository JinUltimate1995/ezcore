<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ezCORE — Kinetic Tiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080d0d;--bg2:#0e1a1a;--panel:#112020;--panel2:#162828;--line:#1e3030;--txt:#e8eef0;--mut:#7a9a9a;--acc:#C6FF4A;--glow:rgba(198,255,74,.3)}
html,body{height:100%;overflow:hidden}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:radial-gradient(120% 80% at 50% -10%,#0e1a1a 0%,var(--bg) 60%) fixed;color:var(--txt);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono',monospace}
.bound{font-family:'Unbounded',sans-serif}
.top{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(8,13,13,.85);backdrop-filter:blur(10px);z-index:5}
.mark{font-family:'Unbounded';font-weight:900;font-size:16px}.mark b{color:var(--acc)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.search input{background:transparent;border:0;color:var(--txt);font-family:'Space Grotesk';font-size:13px;width:160px;outline:none}

.main{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;perspective:1200px}

/* 3D wall */
.wall{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 0;position:relative}
.grid3d{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;transform:rotateX(8deg) rotateY(-4deg);transform-style:preserve-3d;width:100%;max-width:900px;transition:transform .1s ease-out}
.tile{
  aspect-ratio:3/4;border-radius:8px;position:relative;overflow:hidden;
  background:linear-gradient(165deg,var(--c1),var(--c2));
  border:1px solid var(--line);cursor:pointer;transition:all .3s cubic-bezier(.2,.9,.25,1.2);
  transform:translateZ(0);box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.tile:hover{transform:translateZ(30px) scale(1.06);border-color:var(--acc);box-shadow:0 12px 30px -8px var(--glow);z-index:5}
.tile .title{position:absolute;bottom:6px;left:6px;right:6px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;z-index:2}
.tile .tag{position:absolute;top:4px;left:4px;font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--acc);z-index:2}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.6));pointer-events:none}

/* bottom info */
.info{padding:16px 24px;border-top:1px solid var(--line);background:rgba(8,13,13,.9);backdrop-filter:blur(10px);display:flex;align-items:center;gap:16px}
.info .big{font-family:'Unbounded';font-weight:900;font-size:18px}
.info .meta{color:var(--mut);font-size:13px;flex:1}
.info .meta span{color:var(--acc)}
.play{background:var(--acc);color:#0a0c0a;border:0;border-radius:10px;padding:10px 20px;font-family:'Space Grotesk';font-weight:700;font-size:14px;cursor:pointer}
.play:hover{box-shadow:0 0 18px -4px var(--acc)}
.hint{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut)}
</style>
</head>
<body>

<div class="top">
  <span class="mark">ez<b>CORE</b></span>
  <div class="spacer"></div>
  <div class="search"><input placeholder="Search games…"></div>
</div>

<div class="main">
  <div class="wall">
    <div class="grid3d" id="grid3d"></div>
  </div>
</div>

<div class="info">
  <div>
    <div class="big" id="infoT">Chrono Trigger</div>
    <div class="meta"><span id="infoTag">SNES-042</span> · 1994 · 1.2 MB · Save Slot 2 · 78%</div>
  </div>
  <button class="play" id="playBtn">▶ Play</button>
  <div class="hint">scroll to dolly · ← → navigate · ↵ play</div>
</div>

<script>
const G=[
  {t:'Chrono Trigger',tag:'SNES-042',c1:'#1a2828',c2:'#0a1414'},
  {t:'Metroid Fusion',tag:'GBA-017',c1:'#1a281a',c2:'#0a140a'},
  {t:'Ocarina of Time',tag:'N64-008',c1:'#28281a',c2:'#14140a'},
  {t:'Silent Hill',tag:'PS1-031',c1:'#1a1a28',c2:'#0a0a14'},
  {t:'Persona 3',tag:'PSP-014',c1:'#281a28',c2:'#140a14'},
  {t:'Mario Kart DS',tag:'DS-022',c1:'#1a2828',c2:'#0a1414'},
  {t:'Final Fantasy VII',tag:'PS1-001',c1:'#28201a',c2:'#14100a'},
  {t:'Symphony of Night',tag:'PS1-044',c1:'#281a20',c2:'#140a10'},
  {t:'Metal Gear Solid',tag:'PS1-019',c1:'#1a281a',c2:'#0a140a'},
  {t:'Resident Evil 2',tag:'PS1-028',c1:'#201a1a',c2:'#100a0a'},
  {t:'Street Fighter II',tag:'SNES-003',c1:'#28281a',c2:'#14140a'},
  {t:'EarthBound',tag:'SNES-067',c1:'#1a2820',c2:'#0a1410'}
];
const grid=document.getElementById('grid3d');
let idx=0;
G.forEach((g,i)=>{
  const d=document.createElement('div');d.className='tile';
  d.style.setProperty('--c1',g.c1);d.style.setProperty('--c2',g.c2);
  d.innerHTML=`<span class="tag">${g.tag}</span><span class="title">${g.t}</span>`;
  d.onclick=()=>{idx=i;update()};
  grid.appendChild(d);
});
function update(){const g=G[idx];document.getElementById('infoT').textContent=g.t;document.getElementById('infoTag').textContent=g.tag}
update();

// mouse parallax
let mx=0,my=0;
document.addEventListener('mousemove',e=>{mx=(e.clientX/window.innerWidth-.5)*8;my=(e.clientY/window.innerHeight-.5)*4;grid.style.transform=`rotateX(${8+my}deg) rotateY(${-4+mx}deg)`});

// scroll = dolly (move through rows)
let scrollY=0;
document.addEventListener('wheel',e=>{scrollY+=e.deltaY;grid.style.transform=`rotateX(8deg) rotateY(-4deg) translateY(${scrollY*.05}px)`});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){idx=(idx+1)%G.length;update()}
  if(e.key==='ArrowLeft'){idx=(idx-1+G.length)%G.length;update()}
  if(e.key==='Enter'){const b=document.getElementById('playBtn');b.textContent='▶ Booting…';setTimeout(()=>{b.textContent='▶ Play'},1200)}
});
</script>
</body>
</html>
