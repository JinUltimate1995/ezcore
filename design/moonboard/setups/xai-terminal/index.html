<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ezCORE — core console</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:40px 24px 80px}
pre.logo{font-size:11px;line-height:1.35;color:#fff;margin:18px 0 6px}
.dim{color:#666}.mid{color:#aaa}.ok{color:#fff}.inv{color:#000;background:#fff;padding:0 6px}
table{width:100%;border-collapse:collapse;margin:18px 0;font-size:13px}
td{padding:5px 10px 5px 0;vertical-align:top}
td:last-child{text-align:right;color:#aaa;white-space:nowrap}
.bar{color:#333}
#out{margin-top:8px;min-height:120px}
#out div{white-space:pre-wrap;word-break:break-word}
.cmdline{display:flex;gap:10px;margin-top:6px;align-items:baseline}
.prompt{color:#fff;font-weight:700}
#cmd{background:none;border:0;outline:0;color:#fff;font-family:inherit;font-size:14px;flex:1;caret-color:#fff}
.hint{margin-top:34px;color:#555;font-size:12px}
.hint b{color:#aaa}
footer{margin-top:50px;color:#444;font-size:12px;display:flex;justify-content:space-between}
.blink{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media(max-width:640px){body{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="dim">ezCORE v0.1.0 — core console · <span id="clock">--:--:--</span> · <span class="ok">●</span> runtime ok</div>
<pre class="logo" id="asciilogo"></pre>
  <div class="mid">18 cores · 0 roms shipped · 0 keys · BYOD only</div>
  <table id="statustbl"></table>
  <div id="out" aria-live="polite"></div>
  <div class="cmdline"><span class="prompt">ezcore&gt;</span><input id="cmd" type="text" placeholder="type 'help'…" autocomplete="off" spellcheck="false"><span class="blink">▊</span></div>
  <div class="hint"><b>commands:</b> help · list · systems · play &lt;id&gt; · core &lt;id&gt; · cheats &lt;id&gt; · status · clear</div>
  <footer><span>ezCORE · setups/xai-terminal</span><span>monospace · monochrome · no chrome</span></footer>
</div>
<script>
document.getElementById('asciilogo').textContent =
"  ___ _______  ___  ____  _____ \n | __|_  / _ \\/ __|/ _ \\| __|\n | _| / / (_) | (__| (_) | _|  \n |___/___\\___/ \\___|\\___/|___|  v0.1";
const cores=[["sameboy","1.0.3","gb/gbc","MIT"],["gambatte","0.5.0","gb/gbc","GPL-2.0"],["mgba","0.11","gba","MPL-2.0"],["snes9x","1.63","snes","custom-NC"],["mesen","0.9.9","nes","GPL-3.0"],["genesis_plus_gx","1.7.4","gen/sms","custom-NC"],["swanstation","1.0.0","psx","GPL-3.0"],["melonds","0.9.3","nds","GPL-3.0"],["ppsspp","1.17+git","psp","GPL-2.0+"],["flycast","2.2+git","dc","GPL-2.0"],["dolphin","rolling","gc/wii","GPL-2.0+"],["mupen64plus","2.8","n64","GPL-2.0"]];
const games=[["ct","Chrono Trigger","snes","snes9x"],["mf","Metroid Fusion","gba","mgba"],["sh","Silent Hill","psx","swanstation"],["ww","Wind Waker","gc","dolphin"]];
document.getElementById('statustbl').innerHTML =
 `<tr><td class="dim">CORES</td><td>18 staged · 17 pinned · 1 building</td></tr>`+
 `<tr><td class="dim">RUNTIME</td><td>ABI v1 · 23 tests green</td></tr>`+
 `<tr><td class="dim">SAVES</td><td>local vault · sync seam ready</td></tr>`+
 `<tr><td class="dim">POLICY</td><td>3ds / switch / ps2 — legal hold</td></tr>`;
const out=document.getElementById('out'),cmd=document.getElementById('cmd');
function say(t){const d=document.createElement('div');d.textContent=t;out.appendChild(d);out.scrollIntoView({block:'end'})}
function run(raw){
 const[a,...rest]=raw.trim().split(/\s+/);const arg=(rest.join(' ')||'').toLowerCase();
 say('ezcore> '+raw.trim());
 if(!a)return;
 if(a==='help')say('help · list · systems · play <id> · core <id> · cheats <id> · status · clear');
 else if(a==='list')games.forEach(g=>say(` ${g[0].padEnd(4)} ${g[1].padEnd(18)} ${g[2].padEnd(5)} ${g[3]}`));
 else if(a==='systems')say('gb gbc gba nes snes genesis sms gg pce psx n64 nds psp dc gc saturn arcade scumm dos 2600');
 else if(a==='core'){const c=cores.find(x=>x[0]===arg);say(c?`${c[0]} ${c[1]} · ${c[2]} · ${c[3]} · sha-pinned ✓`:`unknown core '${arg}'. try: list`)}
 else if(a==='cheats'){say(arg==='mf'?'mf · 2 on: [Infinite Energy] [Moon Jump]':'no cheats filed for this game yet. press A to add.')}
 else if(a==='play'){const g=games.find(x=>x[0]===arg||x[1].toLowerCase().includes(arg));say(g?`booting ${g[1]} … first frame in 0.4s (demo)`:`unknown game '${arg}'. try: list`)}
 else if(a==='status')say('17/17 staged cores identify · saves local · sync: none configured');
 else if(a==='clear')out.innerHTML='';
 else say(`unknown: '${a}'. type 'help'.`);
}
cmd.addEventListener('keydown',e=>{if(e.key==='Enter'){run(cmd.value);cmd.value=''}});
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB')},1000);
say('core console ready. 17 cores staged. type: list');
setTimeout(()=>cmd.focus(),400);
</script>
</body>
</html>
